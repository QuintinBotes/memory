name: Review Voice

# Reviews each pull request and posts only verified findings (#110). Not a
# required check: ci-green does not wait for it. Without the
# ANTHROPIC_API_KEY secret it skips, and a fork's pull request gets none.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-voice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: QuintinBotes/review-voice@98ad06075b353834f9ae19044661b403c00e407f # v1.30.0+fix-525 (main, unreleased)
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          post: true
